pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 access_log /dev/stdout;
 error_log /dev/stderr warn;
 client_body_temp_path /tmp/client_temp;
 proxy_temp_path /tmp/proxy_temp;
 fastcgi_temp_path /tmp/fastcgi_temp;
 uwsgi_temp_path /tmp/uwsgi_temp;
 scgi_temp_path /tmp/scgi_temp;
 server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 64k;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self'; img-src 'self' data:; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  location /internal { return 404; }
  location /health { access_log off; return 200 'ok'; }
  location /api/projects { proxy_pass http://project-service:3001; proxy_set_header X-Correlation-ID $request_id; proxy_connect_timeout 3s; proxy_read_timeout 12s; }
  location /api/tasks { proxy_pass http://task-service:3002; proxy_set_header X-Correlation-ID $request_id; proxy_connect_timeout 3s; proxy_read_timeout 12s; }
  location /docs/projects/ { proxy_pass http://project-service:3001/docs/; proxy_set_header Accept-Encoding ""; proxy_redirect /docs/ /docs/projects/; sub_filter_once off; sub_filter_types application/javascript application/json; sub_filter '/docs/' '/docs/projects/'; }
  location /docs/tasks/ { proxy_pass http://task-service:3002/docs/; proxy_set_header Accept-Encoding ""; proxy_redirect /docs/ /docs/tasks/; sub_filter_once off; sub_filter_types application/javascript application/json; sub_filter '/docs/' '/docs/tasks/'; }
  location / { try_files $uri $uri/ /index.html; }
 }
}
