name: taskflow
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run node scripts/configure.mjs}
      PROJECT_DB_PASSWORD: ${PROJECT_DB_PASSWORD:?Run configuration}
      TASK_DB_PASSWORD: ${TASK_DB_PASSWORD:?Run configuration}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/init-db.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d taskflow"]
      interval: 3s
      timeout: 3s
      retries: 30
    # Database has no external port in the full stack. Use the dev override for host development.
  project-migrate:
    build:
      context: .
      dockerfile: services/project-service/Dockerfile
    image: taskflow-project-service:dev
    command: ["../../node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://project_user:${PROJECT_DB_PASSWORD}@postgres:5432/taskflow?schema=projects
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  task-migrate:
    build:
      context: .
      dockerfile: services/task-service/Dockerfile
    image: taskflow-task-service:dev
    command: ["../../node_modules/.bin/prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://task_user:${TASK_DB_PASSWORD}@postgres:5432/taskflow?schema=tasks
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  project-service:
    image: taskflow-project-service:dev
    build:
      context: .
      dockerfile: services/project-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://project_user:${PROJECT_DB_PASSWORD}@postgres:5432/taskflow?schema=projects
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      TASK_SERVICE_URL: http://task-service:3002
    depends_on:
      project-migrate: {condition: service_completed_successfully}
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 20
  task-service:
    image: taskflow-task-service:dev
    build:
      context: .
      dockerfile: services/task-service/Dockerfile
    environment:
      DATABASE_URL: postgresql://task_user:${TASK_DB_PASSWORD}@postgres:5432/taskflow?schema=tasks
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      PROJECT_SERVICE_URL: http://project-service:3001
    depends_on:
      task-migrate: {condition: service_completed_successfully}
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      retries: 20
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: taskflow-web:dev
    ports: ["127.0.0.1:8080:8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 3s
      timeout: 2s
      retries: 20
    depends_on:
      project-service: {condition: service_healthy}
      task-service: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  postgres-data:
