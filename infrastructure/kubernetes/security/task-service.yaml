apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: task-service
  namespace: taskflow
spec:
  podSelector:
    matchLabels:
      app: task-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - web
                  - project-service
      ports:
        - protocol: TCP
          port: 3002
